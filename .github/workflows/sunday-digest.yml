name: Meow Sunday Reminder Digest
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  sunday-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Send Sunday summary
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          FEEDBACK_BASE_URL: ${{ vars.FEEDBACK_BASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python weekly_digest.py
