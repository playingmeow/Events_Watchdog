name: MakeIT booking sync
on:
  schedule:
    - cron: '15 0 * * *' # 08:15 Singapore time
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read Gmail and Calendar but do not write the snapshot'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: events-watchdog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile Gmail and Calendar
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SYNC_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$SYNC_DRY_RUN" = "true" ]; then
            python makeit_sync.py --dry-run
          else
            python makeit_sync.py
          fi
      - name: Commit updated snapshot
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          if ! git diff --quiet -- makeit_bookings.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add makeit_bookings.json
            git commit -m 'chore: sync MakeIT booking snapshot [skip ci]'
            git push
          else
            echo "Snapshot is unchanged."
          fi
