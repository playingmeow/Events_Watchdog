name: Hirosaki ntfy Delivery Test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Send clearly labelled test notification (no state changes)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          FEEDBACK_BASE_URL: ${{ vars.FEEDBACK_BASE_URL }}
        run: python test_hirosaki_delivery.py
